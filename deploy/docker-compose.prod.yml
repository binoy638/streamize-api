services:
  api:
    image: ghcr.io/binoy638/streamize-api:latest
    environment:
      STREAMIZE_ENV: ${STREAMIZE_ENV:-production}
      STREAMIZE_HTTP_ADDR: ${STREAMIZE_HTTP_ADDR:-:8080}
      STREAMIZE_DATABASE_PATH: ${STREAMIZE_DATABASE_PATH:-/data/streamize.db}
      STREAMIZE_MEDIA_ROOT: ${STREAMIZE_MEDIA_ROOT:-/media}
      STREAMIZE_QBITTORRENT_URL: ${STREAMIZE_QBITTORRENT_URL:-http://qbittorrent:8081}
      STREAMIZE_QBITTORRENT_USERNAME: ${STREAMIZE_QBITTORRENT_USERNAME:-admin}
      STREAMIZE_QBITTORRENT_PASSWORD: ${STREAMIZE_QBITTORRENT_PASSWORD:-adminadmin}
      STREAMIZE_SESSION_COOKIE_NAME: ${STREAMIZE_SESSION_COOKIE_NAME:-streamize_session}
      STREAMIZE_SESSION_TTL: ${STREAMIZE_SESSION_TTL:-168h}
      STREAMIZE_ADMIN_USERNAME: ${STREAMIZE_ADMIN_USERNAME:-admin}
      STREAMIZE_ADMIN_PASSWORD: ${STREAMIZE_ADMIN_PASSWORD:-adminadmin}
      STREAMIZE_ADMIN_STORAGE_QUOTA_BYTES: ${STREAMIZE_ADMIN_STORAGE_QUOTA_BYTES:-0}
      STREAMIZE_SECURE_COOKIES: ${STREAMIZE_SECURE_COOKIES:-true}
      STREAMIZE_TRUSTED_PROXY_HEADERS: ${STREAMIZE_TRUSTED_PROXY_HEADERS:-true}
      STREAMIZE_LOG_LEVEL: ${STREAMIZE_LOG_LEVEL:-info}
      STREAMIZE_LOG_FORMAT: ${STREAMIZE_LOG_FORMAT:-json}
      STREAMIZE_WORKER_ENABLED: ${STREAMIZE_WORKER_ENABLED:-true}
      STREAMIZE_WORKER_POLL_INTERVAL: ${STREAMIZE_WORKER_POLL_INTERVAL:-5s}
      STREAMIZE_FFMPEG_PATH: ${STREAMIZE_FFMPEG_PATH:-ffmpeg}
      STREAMIZE_FFPROBE_PATH: ${STREAMIZE_FFPROBE_PATH:-ffprobe}
    depends_on:
      - qbittorrent
    volumes:
      - ${STREAMIZE_HOST_DATA_DIR:-./data}:/data
      - ${STREAMIZE_HOST_MEDIA_DIR:-./media}:/media
    networks:
      - default
      - traefik
    labels:
      # Routed by the existing Traefik instance (n8n-compose-traefik-1).
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-n8n-compose_default}"
      - "traefik.http.routers.streamize.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.streamize.entrypoints=websecure"
      - "traefik.http.routers.streamize.tls.certresolver=mytlschallenge"
      - "traefik.http.services.streamize.loadbalancer.server.port=8080"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Kolkata}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT:-8081}
    ports:
      # WebUI bound to localhost only — reach it via an SSH tunnel, not the public internet.
      - "127.0.0.1:${QBITTORRENT_WEBUI_PORT:-8081}:${QBITTORRENT_WEBUI_PORT:-8081}"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${QBITTORRENT_HOST_CONFIG_DIR:-./data/qbittorrent-config}:/config
      - ${STREAMIZE_HOST_MEDIA_DIR:-./media}:/media
    networks:
      - default
    restart: unless-stopped

networks:
  # Internal network for api <-> qbittorrent.
  default:
  # The pre-existing Traefik network — Traefik reaches the api over this.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-n8n-compose_default}
